<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sats On The Road, field dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--orange:#F7931A;--orange-deep:#C46B07;--ink:#0D0D0D;--ink2:#1B1815;--paper:#F6EFE3;--paper2:#ECE2CE;--line:#d8cdb3;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--paper);color:var(--ink);width:1280px;padding:46px 54px;}
  .head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:20px;}
  .head img{height:60px;}
  .head .t{text-align:right;}
  .head h1{font-size:30px;font-weight:800;letter-spacing:-.02em;}
  .head .mono{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink2);letter-spacing:.04em;margin-top:4px;}
  .note{margin-top:14px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--orange-deep);background:#fff3e0;border:1px solid #f3c88a;border-radius:8px;padding:8px 12px;display:inline-block;}
  .tiles{margin-top:22px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
  .tile{background:#fffaf2;border:1.5px solid var(--line);border-radius:14px;padding:16px 16px 14px;}
  .tile .lab{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-deep);}
  .tile .val{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1;}
  .tile .val.dash{color:var(--line);}
  h2{font-size:18px;font-weight:700;margin:30px 0 14px;letter-spacing:-.01em;}
  h2 .mono{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink2);font-weight:500;margin-left:8px;letter-spacing:.08em;}
  /* route strip */
  .route{position:relative;background:#fffaf2;border:1.5px solid var(--line);border-radius:16px;padding:40px 30px 30px;overflow:hidden;}
  .road{position:relative;height:8px;background:var(--ink);border-radius:4px;margin:30px 10px;}
  .road::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,var(--orange) 22px 40px);opacity:.9;height:3px;top:2.5px;}
  .stops{display:flex;justify-content:space-between;margin:0 10px;}
  .stop{position:relative;text-align:center;flex:1;}
  .pin{width:22px;height:22px;border-radius:50%;background:var(--orange);border:4px solid var(--ink);margin:0 auto -34px;position:relative;top:-45px;}
  .stop .city{font-weight:700;font-size:16px;}
  .stop .ctry{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;}
  .stop .mini{margin-top:6px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--orange-deep);}
  /* bar chart */
  .chart{background:#fffaf2;border:1.5px solid var(--line);border-radius:16px;padding:24px 26px;position:relative;}
  .bars{display:flex;align-items:flex-end;gap:26px;height:220px;padding-top:10px;}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar .col{width:70%;background:var(--orange);border-radius:7px 7px 0 0;min-height:3px;}
  .bar .n{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;margin-bottom:6px;}
  .bar .x{margin-top:10px;font-size:13px;font-weight:600;}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--ink2);letter-spacing:.06em;background:rgba(246,239,227,.6);border-radius:16px;}
  footer{margin-top:26px;padding-top:16px;border-top:2px solid var(--line);display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink2);}
  footer b{color:var(--orange-deep);}
</style>
</head>
<body>
  <div class="head">
    <img src="../media/brand/sotr-logo.png" alt="Sats On The Road">
    <div class="t"><h1>Field dashboard</h1><div class="mono">reflects data/dashboard.csv · Phase 1A</div></div>
  </div>
  <div class="note" id="note">Awaiting live data, fill data/dashboard.csv and this fills in automatically.</div>

  <div class="tiles" id="tiles"></div>

  <h2>The route so far <span class="mono">one pin per stop</span></h2>
  <div class="route"><div class="road"></div><div class="stops" id="stops"></div></div>

  <h2>People onboarded, by stop</h2>
  <div class="chart"><div class="bars" id="bars"></div><div class="empty" id="empty">Awaiting live data</div></div>

  <footer><span>satsontheroad.africa</span><span><b>₿</b> Driving Bitcoin across the African continent</span></footer>

<script>
  // Embedded fallback = the Phase 1A stops from dashboard.csv (counts pending).
  const FALLBACK=[
    {city:"Base",country:"Nigeria",people:null,merchants:null,ambassadors:null,sats:null},
    {city:"[City]",country:"Benin",people:null,merchants:null,ambassadors:null,sats:null},
    {city:"Lomé",country:"Togo",people:null,merchants:null,ambassadors:null,sats:null},
    {city:"[City]",country:"Burkina Faso",people:null,merchants:null,ambassadors:null,sats:null},
  ];
  const num=v=>{v=(v||"").toString().trim();return /^\d+$/.test(v)?+v:null;};
  function parseCSV(t){
    const rows=t.split(/\r?\n/).filter(l=>l.trim()&&!l.trim().startsWith("#"));
    const head=rows.shift().split(",");
    return rows.map(r=>{const c=r.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(s=>s.replace(/,$/,"").replace(/^"|"$/g,""));
      const o={};head.forEach((h,i)=>o[h.trim()]=c[i]);return o;});
  }
  function render(stops){
    const have=stops.some(s=>s.people!=null);
    const sum=k=>stops.reduce((a,s)=>a+(s[k]||0),0);
    const fmt=n=>have?n.toLocaleString():"-";
    const tiles=[["Stops",stops.length],["Countries",new Set(stops.map(s=>s.country)).size],
      ["People",have?sum("people"):"-"],["Merchants",have?sum("merchants"):"-"],
      ["Ambassadors",have?sum("ambassadors"):"-"],["Sats circulated",have?sum("sats").toLocaleString():"-"]];
    document.getElementById("tiles").innerHTML=tiles.map(([l,v])=>
      `<div class="tile"><div class="lab">${l}</div><div class="val ${v==="-"?"dash":""}">${v}</div></div>`).join("");
    document.getElementById("stops").innerHTML=stops.map(s=>
      `<div class="stop"><div class="pin"></div><div class="city">${s.city}</div><div class="ctry">${s.country}</div>`+
      `<div class="mini">${s.people!=null?s.people+" onboarded":"pending"}</div></div>`).join("");
    if(have){
      document.getElementById("empty").style.display="none";
      const max=Math.max(...stops.map(s=>s.people||0),1);
      document.getElementById("bars").innerHTML=stops.map(s=>
        `<div class="bar"><div class="n">${s.people||0}</div><div class="col" style="height:${(s.people||0)/max*100}%"></div><div class="x">${s.city}</div></div>`).join("");
      document.getElementById("note").style.display="none";
    }
  }
  fetch("./dashboard.csv").then(r=>r.ok?r.text():Promise.reject()).then(t=>{
    const rows=parseCSV(t).map(r=>({city:r.city,country:r.country,people:num(r.people_onboarded),
      merchants:num(r.merchants_onboarded),ambassadors:num(r.ambassadors_trained),sats:num(r.sats_circulated)}))
      .filter(r=>r.country&&r.country.trim());
    render(rows.length?rows:FALLBACK);
  }).catch(()=>render(FALLBACK));
</script>
</body>
</html>
