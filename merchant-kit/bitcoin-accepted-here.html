<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bitcoin Accepted Here, A4 sign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  @page{size:A4 portrait;margin:0;}
  :root{--orange:#F7931A;--orange-deep:#C46B07;--ink:#0D0D0D;--ink2:#1B1815;--paper:#F6EFE3;--line:#d8cdb3;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:210mm;height:297mm;}
  body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--paper);color:var(--ink);padding:10mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .card{width:100%;height:100%;border:4px solid var(--ink);border-radius:9mm;padding:14mm 12mm;display:flex;flex-direction:column;align-items:center;text-align:center;background:radial-gradient(120% 60% at 50% -8%,rgba(247,147,26,.16),transparent 60%),#fffaf2;}
  .logo{height:34mm;}
  .kicker{margin-top:8mm;font-family:"JetBrains Mono",monospace;font-size:18px;letter-spacing:.24em;text-transform:uppercase;color:var(--orange-deep);font-weight:600;}
  h1{margin-top:4mm;font-weight:800;font-size:82px;line-height:.93;letter-spacing:-.02em;}
  h1 .b{color:var(--orange);}
  .subline{margin-top:7mm;display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);font-family:"JetBrains Mono",monospace;font-weight:600;font-size:20px;padding:5mm 9mm;border-radius:999px;}
  .subline .bolt{color:var(--orange);font-size:24px;}
  .qrwrap{margin-top:11mm;width:92mm;height:92mm;border:3px dashed var(--orange);border-radius:7mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5mm;background:#fff;}
  .qrbox{width:58mm;height:58mm;border-radius:4mm;background:linear-gradient(45deg,#0d0d0d 25%,transparent 25%,transparent 75%,#0d0d0d 75%) 0 0/14mm 14mm,linear-gradient(45deg,#0d0d0d 25%,transparent 25%,transparent 75%,#0d0d0d 75%) 7mm 7mm/14mm 14mm,#fff;opacity:.9;position:relative;}
  .qrbox::after{content:"\2301";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--orange);background:rgba(255,255,255,.55);}
  .qrlabel{font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.16em;color:var(--ink2);text-transform:uppercase;}
  .shop{margin-top:9mm;width:100%;}
  .shop .ln{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);}
  .shop .rule{margin-top:3mm;border-bottom:2px solid var(--line);height:10mm;}
  .locale{margin-top:5mm;font-style:italic;color:var(--ink2);font-size:18px;}
  footer{margin-top:auto;width:100%;display:flex;align-items:center;justify-content:space-between;padding-top:6mm;border-top:2px solid var(--line);font-family:"JetBrains Mono",monospace;font-size:15px;color:var(--ink2);}
  footer b{color:var(--orange-deep);}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="../media/brand/sotr-logo.png" alt="Sats On The Road">
    <div class="kicker">We take Bitcoin</div>
    <h1>BITCOIN<br>ACCEPTED <span class="b">HERE</span></h1>
    <div class="subline"><span class="bolt">⚡</span> Pay in sats · fast · no bank needed</div>
    <div class="qrwrap"><div class="qrbox"></div><div class="qrlabel">Scan to pay this shop</div></div>
    <div class="shop"><div class="ln">Shop name</div><div class="rule"></div><div class="locale">[ "Bitcoin accepted here" in your local language ]</div></div>
    <footer><span>satsontheroad.africa</span><span><b>₿</b> Sats On The Road</span></footer>
  </div>
</body>
</html>
