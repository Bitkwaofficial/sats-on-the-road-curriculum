<?xml version="1.0" encoding="UTF-8"?>
<!-- Export to PDF via a browser: open the SVG and Print > Save as PDF (A4). -->
<!-- Tent card / table stand, two-up on A4 portrait (210x297mm). Print, fold along the centre line, stand it up. -->
<!-- The top panel is printed upside down so that, once folded, both sides of the tent read upright. -->
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 2100 2970" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="2100" height="2970" fill="#F6EFE3"/>

  <!-- ===== BOTTOM PANEL (front, upright) ===== -->
  <g>
    <rect x="150" y="1560" width="1800" height="1260" fill="#F6EFE3" stroke="#0D0D0D" stroke-width="8"/>
    <rect x="150" y="1560" width="1800" height="150" fill="#F7931A"/>
    <text x="1050" y="1665" text-anchor="middle" font-size="80" font-weight="bold" fill="#0D0D0D">&#8383; SATS ON THE ROAD</text>

    <text x="1050" y="1870" text-anchor="middle" font-size="110" font-weight="bold" fill="#0D0D0D">Pay with Bitcoin &#9889;</text>

    <!-- QR placeholder -->
    <rect x="775" y="1960" width="550" height="550" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="6"/>
    <line x1="775" y1="1960" x2="1325" y2="2510" stroke="#CFC6B6" stroke-width="3"/>
    <line x1="1325" y1="1960" x2="775" y2="2510" stroke="#CFC6B6" stroke-width="3"/>
    <text x="1050" y="2260" text-anchor="middle" font-size="90" font-weight="bold" fill="#0D0D0D" letter-spacing="6">QR</text>
    <text x="1050" y="2610" text-anchor="middle" font-size="45" fill="#0D0D0D">Paste your payment QR here</text>
    <text x="1050" y="2760" text-anchor="middle" font-size="40" fill="#8A8172">satsontheroad.africa</text>
  </g>

  <!-- ===== FOLD LINE ===== -->
  <line x1="150" y1="1485" x2="1950" y2="1485" stroke="#0D0D0D" stroke-width="3" stroke-dasharray="25 20"/>
  <text x="1050" y="1465" text-anchor="middle" font-size="40" fill="#8A8172" letter-spacing="4">FOLD HERE</text>
  <path d="M 230 1485 l -30 -18 l 0 36 z" fill="#8A8172"/>
  <path d="M 1870 1485 l 30 -18 l 0 36 z" fill="#8A8172"/>

  <!-- ===== TOP PANEL (back, printed upside down so it reads upright when folded) ===== -->
  <g transform="rotate(180 1050 742)">
    <rect x="150" y="112" width="1800" height="1260" fill="#F6EFE3" stroke="#0D0D0D" stroke-width="8"/>
    <rect x="150" y="112" width="1800" height="150" fill="#F7931A"/>
    <text x="1050" y="217" text-anchor="middle" font-size="80" font-weight="bold" fill="#0D0D0D">&#8383; SATS ON THE ROAD</text>

    <text x="1050" y="422" text-anchor="middle" font-size="110" font-weight="bold" fill="#0D0D0D">Pay with Bitcoin &#9889;</text>

    <rect x="775" y="512" width="550" height="550" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="6"/>
    <line x1="775" y1="512" x2="1325" y2="1062" stroke="#CFC6B6" stroke-width="3"/>
    <line x1="1325" y1="512" x2="775" y2="1062" stroke="#CFC6B6" stroke-width="3"/>
    <text x="1050" y="812" text-anchor="middle" font-size="90" font-weight="bold" fill="#0D0D0D" letter-spacing="6">QR</text>
    <text x="1050" y="1162" text-anchor="middle" font-size="45" fill="#0D0D0D">Paste your payment QR here</text>
    <text x="1050" y="1312" text-anchor="middle" font-size="40" fill="#8A8172">satsontheroad.africa</text>
  </g>
</svg>
